[newrelic]
# License key and application name are supplied at runtime, outside the image.
monitor_mode = true
log_level = info
distributed_tracing.enabled = true
transaction_tracer.record_sql = obfuscated
strip_exception_messages.enabled = true
attributes.include =
attributes.exclude = request.headers.* request.parameters.* response.headers.*
# A separate bounded, sanitized Logs API exporter is the sole forwarding path.
# Do not turn automatic forwarding on as well.
application_logging.forwarding.enabled = false
application_logging.enabled = false
browser_monitoring.auto_instrument = false
