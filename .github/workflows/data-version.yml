name: Data version
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-data-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check version before merge
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_data_version.py "$BASE_SHA" HEAD
      - name: Check released commit
        if: github.event_name == 'push'
        run: python scripts/check_data_version.py HEAD^ HEAD
