name: az-election-explorer

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: az-election-explorer-backend:local
  init: true
  pull_policy: never
  environment:
    DATABASE_URL: sqlite:////app/backend/local/elections.db
    TZ: ${REFRESH_TIMEZONE:-Asia/Kolkata}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  volumes:
    - state:/app/backend/local
    - ./.production/raw:/app/data/raw
    - ./.production/backups:/backups
  logging: *logging
  stop_grace_period: 40s

services:
  initialize:
    <<: *app
    user: "0:0"
    command: [python, production/manage_db.py, initialize]
    environment:
      APP_UID: ${APP_UID:-501}
      APP_GID: ${APP_GID:-20}
    volumes:
      - state:/app/backend/local
      - ./.production/seed:/seed:ro
    restart: "no"

  migrate:
    <<: *app
    command: [python, production/manage_db.py, migrate]
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *app
    build:
      context: .
      dockerfile: production/backend.Dockerfile
      args:
        APP_UID: ${APP_UID:-501}
        APP_GID: ${APP_GID:-20}
    command: [python, production/run_backend.py]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: production/frontend.Dockerfile
    image: az-election-explorer-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:80"
    networks:
      default:
        aliases: [caddy]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:80/api/health"]
      interval: 20s
      timeout: 8s
      retries: 3

  tunnel:
    image: az-election-explorer-tunnel:local
    build:
      context: .
      dockerfile: production/tunnel.Dockerfile
    init: true
    user: "${APP_UID:-501}:${APP_GID:-20}"
    profiles: [public]
    command: [tunnel, --no-autoupdate, --output, json, --metrics, "0.0.0.0:2000", run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    logging: *logging
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  state:
  caddy_data:
  caddy_config:

secrets:
  tunnel_token:
    file: ${CLOUDFLARE_TOKEN_FILE:-./.production/secrets/tunnel-token}
